<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09111f">
  <title>Mood Weather — สภาพอากาศของใจ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="home">

  <!-- Background -->
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>
  <div id="particles" aria-hidden="true"></div>

  <!-- Top Bar -->
  <header class="topbar">

    <button
      class="brand"
      onclick="showHome()"
      aria-label="กลับหน้าหลัก"
    >
      <span class="brand-mark">☁️</span>
      <span>Mood Weather</span>
    </button>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="toggleTheme()"
        id="themeBtn"
        title="สลับโหมด"
      >
        ◐
      </button>

      <button
        class="icon-btn"
        onclick="showHistory()"
        title="ประวัติ"
      >
        ◷
      </button>

    </div>
  </header>

  <!-- Main App -->
  <main class="app" id="app"></main>

  <!-- Footer -->
  <footer class="footer">
    A little check-in with yourself ·
    ไม่ใช่การวินิจฉัยทางการแพทย์
  </footer>

  <script src="script.js"></script>

</body>
</html>
